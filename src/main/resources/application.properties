# ===== DATABASE =====
# PostgreSQL Configuration (with pgvector support)
spring.datasource.url=jdbc:postgresql://localhost:5432/sigverify
spring.datasource.username=postgres
spring.datasource.password=dev123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect
# Flyway owns the schema; skip Hibernate's schema validation
# (Hibernate 5.3 cannot validate the custom pgvector "vector(128)" column type)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
tensorflow.model.path=src/main/resources/model
images.save.path=src/main/resources/Images