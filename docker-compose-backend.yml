version: '3.8'

services:
  # ✅ PostgreSQL with pgvector support
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sigverify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - sigverify-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Backend (Spring Boot)
  backend:
    build: .
    container_name: sigverify-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sigverify
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: dev123
      TENSORFLOW_MODEL_PATH: /app/model
      IMAGES_SAVE_PATH: /app/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigverify-net
    volumes:
      - ./src/main/resources/model:/app/model
      - ./src/main/resources/Images:/app/images

  # Frontend (React)
  frontend:
    build:
      context: ./src/main/webapp
      dockerfile: Dockerfile
    container_name: sigverify-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - sigverify-net

  # 🎨 pgAdmin - Web UI for PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sigverify-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigverify-net
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  sigverify-net:
    driver: bridge
